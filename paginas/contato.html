<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../estilos/stylemob.css">
    <title>Contato</title>
</head>
<body>         
    
    <h1 id="h1contato">Vamos trabalhar juntos?</h1>
    <h2 id="h2contato">Se tiver alguma sugestão, feedback ou oportunidade de trabalho, pode me contatar por aqui: </h2>
    <form action="https://api.staticforms.dev/submit" method="POST" id="form">
        
    
    <div id="ctt_nmem">
        <div class="campo">
        <input type="text" name="nome" id="nome_ctt" placeholder="Nome">
        </div>
         <div class="campo">
        
        <input type="email" name="email" id="email_ctt" required placeholder="E-mail">
        </div>
    </div>

    <div id="ctt_msg">
        
        <textarea name="mensagem" id="mensagem_ctt" rows="5" required placeholder="Mensagem"></textarea>
        <div id="botaoenviar">
        <input type="submit" value="Enviar" id="botao-enviar">
    </div>
    <div id="feedback-form">
    </div>
    <p id="contatomail"><a href="mailto:helenariva.dev@gmail.com">Ou, se preferir, pode falar comigo por e-mail mesmo!  <span id="mail">helenariva.dev@gmail.com </span></a> </p>
    
</form>
<script src="../scripts/formscript.js"></script>
</body>
</html>
