<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../estilos/stylemob.css">
    <title>Contato</title>
</head>
<body>         
    <h1 id="h1contato">Contate-me:</h1>
    <form action="https://api.staticforms.dev/submit" method="POST">
        <input type="hidden" name="apiKey" value="#"/>
    
    <div id="ctt_nmem">
        <div class="campo">
        <input type="text" name="nome" id="nome_ctt" placeholder="Nome">
        </div>
         <div class="campo">
        
        <input type="email" name="email" id="email_ctt" required placeholder="E-mail">
        </div>
    </div>

    <div id="ctt_msg">
        
        <textarea name="mensagem" id="mensagem_ctt" rows="5" required placeholder="Mensagem"></textarea>
        <div id="botaoenviar">
        <input type="submit" value="Enviar" id="botao-enviar">
    </div>
</form>
</body>
</html>
